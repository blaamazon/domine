name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        working-directory: packages/backend

      - name: Build
        run: npm run build
        working-directory: packages/backend

      - name: Test
        run: npm test
        working-directory: packages/backend
        env:
          DATABASE_URL: "postgresql://localhost:5432/domine_test"